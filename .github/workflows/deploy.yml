# .github/workflows/deploy.yml
# Specification: 12_Deployment/CI_CD_Pipeline.md
name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy FastAPI Backend (Railway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli || pip install railway-cli
      - name: Deploy to Railway
        run: railway up --service api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Deploy Next.js Frontend (Vercel)
    runs-on: ubuntu-latest
    steps:
      # Vercel auto-deploys from Git — this is a fallback
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

  smoke-test:
    name: Post-Deployment Smoke Tests
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployments to stabilize
        run: sleep 30
      - name: Verify Backend API Health
        run: curl -f https://api.memegpt.com/api/v1/health || exit 1
      - name: Verify Frontend Web Health
        run: curl -f https://memegpt.com || exit 1
