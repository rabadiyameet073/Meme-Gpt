# .github/workflows/ci.yml
# Specification: 12_Deployment/CI_CD_Pipeline.md
#
# NOTE: this repository is a monorepo. The root package.json is a script
# launcher only — it declares no `lint` and no `build` script and installs a
# single devDependency (concurrently). Every frontend job therefore runs inside
# its own workspace directory (AUDIT-REPORT D-3).
name: CI
on: [pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - run: pip install ruff pytest pytest-asyncio httpx

      # Blocking gate: rules that indicate a real defect (syntax errors,
      # undefined names, broken comparisons, `assert False`).
      - name: Lint (errors)
        run: ruff check backend/ --select E9,F63,F7,F82

      # The full house style in pyproject.toml currently reports ~3.4k findings
      # (mostly E501/I001). Reporting them keeps the debt visible; blocking on
      # them would mean a lint step that can never pass.
      - name: Lint (style report)
        run: ruff check backend/ --statistics
        continue-on-error: true

      # conftest.py and the `app` package both resolve relative to backend/,
      # so the suite must run from that directory, not from the repo root.
      # Coverage is measured against the measured 84% baseline with the
      # documented >80% target as the floor (upgraded_docs/14_Testing_Suite.md).
      - name: Test (coverage gate)
        working-directory: backend
        run: >
          pytest tests/ -m "not timing" -v --tb=short
          --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html
          --cov-fail-under=80
        env:
          APP_ENV: test
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # The wall-clock budgets in tests/test_performance.py cannot hold under the
      # coverage tracer, so they run uninstrumented in their own step.
      - name: Latency benchmarks (no coverage)
        working-directory: backend
        run: pytest tests/test_performance.py -m timing -v --tb=short
        env:
          APP_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      # The blog manifest (lib/blog.ts), the rendered bodies in
      # app/(marketing)/blog/[slug]/page.tsx and sitemap.ts must agree, or the
      # sitemap advertises posts that render nothing.
      - name: Blog manifest consistency
        working-directory: .
        run: python scripts/generate_blog_posts.py

      - run: npx tsc --noEmit

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
