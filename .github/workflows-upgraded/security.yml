name: Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit (pip-audit / npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: pip-audit (backend)
        working-directory: backend
        run: |
          pip-audit -r requirements.txt --strict --progress-spinner off \
            --ignore-vuln GHSA-4xh5-x5gv-qwph || true
          pip-audit -r requirements.txt --progress-spinner off --format json \
            --output pip-audit-report.json || true

      - name: bandit (backend, high severity only)
        working-directory: backend
        run: |
          bandit -r app -ll -q -f txt || echo "::warning::bandit reported findings"

      - name: npm audit (workspaces)
        run: |
          for dir in frontend apps/web apps/mobile; do
            if [ -f "$dir/package.json" ]; then
              echo "--- $dir"
              (cd "$dir" && npm audit --omit=dev --audit-level=high || true)
            fi
          done

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          if-no-files-found: ignore

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on committed .env files
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git — remove it from the index"
            exit 1
          fi
          echo ".env is not tracked"

      - name: Guard against obvious key material
        run: |
          if git grep -nEI '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' \
              -- ':!*.md' ':!*.lock' ':!package-lock.json'; then
            echo "::error::Possible committed credential detected"
            exit 1
          fi
          echo "No credential patterns found"
