name: Scheduled Meme Indexing

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:

jobs:
  reindex:
    name: Full vector index rebuild
    runs-on: ubuntu-latest

    # The pipeline lives in backend/ and resolves `app` relative to that directory.
    defaults:
      run:
        working-directory: backend

    env:
      # APP_ENV must not be a hermetic value (test/ci) or the embedded/remote
      # vector backend is skipped and the job silently indexes nothing.
      APP_ENV: production
      PYTHONUNBUFFERED: "1"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require a Qdrant target
        run: |
          if [ -z "$QDRANT_URL" ]; then
            echo "::error::QDRANT_URL is required — this runner is ephemeral, so an on-disk index would be discarded."
            exit 1
          fi

      - name: Rebuild vector index
        run: python scripts/index_to_qdrant.py --recreate
