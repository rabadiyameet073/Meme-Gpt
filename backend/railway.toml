[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Single worker is mandatory: embedded Qdrant takes an exclusive file lock on
# QDRANT_LOCAL_PATH and chat state is held in-process (see deployment_overview
# pre-deploy checklist item 6).
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30

[[services]]
name = "memegpt-api"
