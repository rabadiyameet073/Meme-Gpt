[pytest]
# Coverage instrumentation multiplies interpreter overhead, which turns the
# wall-clock assertions in tests/test_performance.py into false failures: the
# module passes 5/5 without coverage and fails the p95 budget under --cov.
# Those benchmarks carry the `timing` marker and CI runs them in a separate,
# uninstrumented step so the coverage gate can be enforced without weakening a
# real latency budget.
markers =
    timing: wall-clock latency/throughput assertion; must run without coverage instrumentation
