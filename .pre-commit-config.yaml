# Local pre-commit gate.
#
# Install once per clone:
#   pip install pre-commit && pre-commit install
#
# Existence of this file is part of the evidence for the "Dependency scanning
# configured" row in app/core/attestation.py.
default_language_version:
  python: python3.11
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^md files/
      - id: end-of-file-fixer
        exclude: ^md files/
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: forbid-submodules

  # Never commit environment files with real values.
  - repo: local
    hooks:
      - id: block-dotenv
        name: Block committed .env files
        language: system
        entry: bash -c 'for f in "$@"; do case "$f" in *.example) ;; *) echo "Refusing to commit $f"; exit 1;; esac; done' --
        files: '(^|/)\.env(\.|$)'
        pass_filenames: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: ["--fix", "--select", "E,F,W,I", "--ignore", "E501"]
        files: ^backend/.*\.py$
      - id: ruff-format
        files: ^backend/.*\.py$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-ll", "-q"]
        files: ^backend/app/.*\.py$
        additional_dependencies: ["bandit[toml]"]
